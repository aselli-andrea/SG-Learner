[metadata]
name = sg-learner
version = 0.1.0
description = Least-privilege OpenStack security groups learned from real traffic
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
classifiers =
    Environment :: OpenStack
    Programming Language :: Python :: 3

[options]
packages = find:
python_requires = >=3.10
install_requires =
    openstacksdk

[options.packages.find]
exclude =
    tests
    tests.*

[options.entry_points]
console_scripts =
    sg-learner-service = sg_learner.service:main
